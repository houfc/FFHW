<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B3B63">
<title>Fairfield Inn &amp; Suites Houston Westchase - Staff Schedule</title>
<style>
  /* Fairfield by Marriott palette — see hotel-schedule-template.html */
  :root {
    --navy-900: #082944;
    --navy: #0B3B63;
    --blue: #105290;
    --blue-600: #004990;
    --sky: #6CADDF;
    --sky-100: #E7F1FA;
    --sand: #F6F3ED;
    --line: #E4DED4;
    --ink: #16222C;
    --muted: #6C7885;
    --faint: #9AA4AF;
    --error: #B50938;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(900px 420px at 15% -10%, rgba(108,173,223,0.28), transparent 60%),
      linear-gradient(160deg, var(--navy) 0%, var(--blue) 52%, var(--blue-600) 100%);
  }

  .gate-card {
    background: #ffffff;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 0 0 28px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    overflow: hidden;
    box-shadow: 0 18px 44px rgba(8, 41, 68, 0.30), 0 2px 6px rgba(8, 41, 68, 0.16);
  }

  /* Brand strip */
  .gate-brand {
    background: var(--navy-900);
    color: #fff;
    padding: 12px 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .ff-emblem { width: 24px; height: 24px; color: #fff; flex-shrink: 0; }
  .brand-word {
    font-size: 0.76rem; font-weight: 800; letter-spacing: 0.22em;
    text-transform: uppercase; line-height: 1;
  }
  .brand-sub {
    font-size: 0.55rem; letter-spacing: 0.16em; text-transform: uppercase;
    opacity: 0.62; line-height: 1; margin-top: 3px; font-weight: 600;
  }

  .gate-body { padding: 26px 26px 0; }

  .gate-card h1 {
    color: var(--navy);
    font-size: 1.02rem;
    font-weight: 700;
    margin-bottom: 5px;
    letter-spacing: -0.005em;
  }
  .gate-card p.sub {
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 22px;
    line-height: 1.45;
  }

  .gate-card input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1.5px solid var(--line);
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.95rem;
    margin-bottom: 4px;
    outline: none;
    background: var(--sand);
    color: var(--ink);
    transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
  }
  .gate-card input[type="password"]::placeholder { color: var(--faint); }
  .gate-card input[type="password"]:focus {
    border-color: var(--sky);
    background: #fff;
    box-shadow: 0 0 0 3px rgba(108,173,223,0.22);
  }

  .gate-card button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--navy), var(--blue));
    color: #fff;
    font-family: inherit;
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: opacity 0.15s ease, transform 0.08s ease;
    box-shadow: 0 2px 8px rgba(11,59,99,0.28);
  }
  .gate-card button:hover:not(:disabled) { opacity: 0.94; }
  .gate-card button:active:not(:disabled) { transform: translateY(1px); }
  .gate-card button:disabled { opacity: 0.55; cursor: default; box-shadow: none; }

  .remember-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin: 16px 0 18px;
    font-size: 0.78rem;
    color: var(--muted);
  }
  .remember-row input { width: 15px; height: 15px; accent-color: var(--blue); }

  .msg {
    font-size: 0.8rem;
    margin-bottom: 12px;
    display: none;
    border-radius: 9px;
    padding: 9px 11px;
    font-weight: 600;
  }
  .msg.error { color: var(--error); background: rgba(181, 9, 56, 0.08); }
  .msg.info  { color: var(--blue);  background: var(--sky-100); }

  .footer-note {
    margin-top: 20px;
    font-size: 0.66rem;
    color: var(--faint);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 700;
  }
</style>
</head>
<body>
  <div class="gate-card" id="gate-card">

    <div class="gate-brand">
      <svg class="ff-emblem" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <path d="M32 5 L46 15 H18 Z" fill="currentColor"/>
        <rect x="9" y="19" width="46" height="34" rx="7" ry="7"
              fill="none" stroke="currentColor" stroke-width="3.5"/>
        <path d="M22 44 V29 h9 M22 37 h7" fill="none" stroke="currentColor"
              stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M37 44 V29 h9 M37 37 h7" fill="none" stroke="currentColor"
              stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div style="text-align:left">
        <div class="brand-word">Fairfield</div>
        <div class="brand-sub">Inn &amp; Suites</div>
      </div>
    </div>

    <div class="gate-body">
      <h1>Houston Westchase</h1>
      <p class="sub">Enter the password to view the staff schedule</p>

      <div class="msg error" id="error-msg">Incorrect password. Please try again.</div>
      <div class="msg info" id="info-msg">Checking&hellip;</div>

      <input type="password" id="pw-input" placeholder="Password" autocomplete="current-password" />

      <div class="remember-row">
        <input type="checkbox" id="remember-cb" checked />
        <label for="remember-cb">Remember me on this device for 30 days</label>
      </div>

      <button id="submit-btn" type="button">View Schedule</button>

      <div class="footer-note">Staff use only</div>
    </div>
  </div>

  var ITERATIONS = 200000;
  var MAGIC = "STATICRYPT_V1::";
  var STORAGE_KEY = "ffw_sched_pw_v1";
  var REMEMBER_DAYS = 30;

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  function tryDecrypt(password) {
    var salt = b64ToBytes(SALT_B64);
    var iv = b64ToBytes(IV_B64);
    var ciphertext = b64ToBytes(CIPHERTEXT_B64);
    var enc = new TextEncoder();

    return crypto.subtle.importKey(
      "raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]
    ).then(function (keyMaterial) {
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: ITERATIONS, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-CBC", length: 256 },
        false,
        ["decrypt"]
      );
    }).then(function (key) {
      return crypto.subtle.decrypt({ name: "AES-CBC", iv: iv }, key, ciphertext);
    }).then(function (plainBuf) {
      var text = new TextDecoder().decode(plainBuf);
      if (text.indexOf(MAGIC) !== 0) {
        throw new Error("bad-password");
      }
      return text.slice(MAGIC.length);
    });
  }

  function render(html) {
    document.open();
    document.write(html);
    document.close();
  }

  function showError() {
    document.getElementById("error-msg").style.display = "block";
    document.getElementById("info-msg").style.display = "none";
    var btn = document.getElementById("submit-btn");
    if (btn) btn.disabled = false;
  }

  function submit() {
    var pwInput = document.getElementById("pw-input");
    var pw = pwInput.value;
    if (!pw) return;

    document.getElementById("submit-btn").disabled = true;
    document.getElementById("error-msg").style.display = "none";
    var info = document.getElementById("info-msg");
    info.textContent = "Checking…";
    info.style.display = "block";

    tryDecrypt(pw).then(function (html) {
      var rememberCb = document.getElementById("remember-cb");
      if (rememberCb && rememberCb.checked) {
        var record = { pw: btoa(pw), exp: Date.now() + REMEMBER_DAYS * 86400000 };
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(record)); } catch (e) {}
      } else {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      }
      render(html);
    }).catch(function () {
      showError();
    });
  }

  function init() {
    var btn = document.getElementById("submit-btn");
    var pwInput = document.getElementById("pw-input");
    if (!btn || !pwInput) return; // page already replaced via document.write()
    btn.addEventListener("click", submit);
    pwInput.addEventListener("keydown", function (e) {
      if (e.key === "Enter") submit();
    });

    // Try a remembered password first (silent auto-unlock).
    var raw;
    try { raw = localStorage.getItem(STORAGE_KEY); } catch (e) { raw = null; }

    if (raw) {
      var record;
      try { record = JSON.parse(raw); } catch (e) { record = null; }

      if (record && record.pw && record.exp && Date.now() < record.exp) {
        var info = document.getElementById("info-msg");
        info.textContent = "Checking…";
        info.style.display = "block";
        btn.disabled = true;

        var pw = atob(record.pw);
        tryDecrypt(pw).then(function (html) {
          render(html);
        }).catch(function () {
          try { localStorage.removeItem(STORAGE_KEY); } catch (e2) {}
          info.style.display = "none";
          btn.disabled = false;
        });
      } else {
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      }
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
